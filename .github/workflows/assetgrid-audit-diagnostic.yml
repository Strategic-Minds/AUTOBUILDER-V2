name: AssetGrid Dependency Audit Diagnostic

on:
  push:
    branches:
      - auto-builder/assetgrid-overnight-autonomy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assetgrid-audit-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency advisory evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture npm audit evidence
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > assetgrid-npm-audit.json
          audit_exit=$?
          echo "audit_exit=$audit_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Emit high and critical advisories
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const audit = JSON.parse(fs.readFileSync('assetgrid-npm-audit.json', 'utf8'))
          const vulnerabilities = audit.vulnerabilities || {}
          let blocking = 0
          for (const [name, detail] of Object.entries(vulnerabilities)) {
            if (!['high', 'critical'].includes(detail.severity)) continue
            blocking += 1
            const via = Array.isArray(detail.via) ? detail.via : []
            const advisories = via
              .filter((entry) => entry && typeof entry === 'object')
              .map((entry) => `${entry.source || 'source?'} ${entry.url || ''} ${entry.title || ''}`.trim())
              .join(' | ')
            const range = detail.range || 'unknown-range'
            const fix = detail.fixAvailable === false ? 'no automatic fix' : JSON.stringify(detail.fixAvailable)
            console.log(`::error file=package-lock.json,title=Dependency audit ${detail.severity}: ${name}::package=${name}; severity=${detail.severity}; range=${range}; fix=${fix}; via=${advisories || JSON.stringify(via)}`)
          }
          const meta = audit.metadata?.vulnerabilities || {}
          console.log(`Audit metadata: ${JSON.stringify(meta)}`)
          if (blocking > 0) process.exit(1)
          NODE

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assetgrid-npm-audit-${{ github.sha }}
          path: assetgrid-npm-audit.json
          retention-days: 14

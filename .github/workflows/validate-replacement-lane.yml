name: Validate replacement consolidation lane

on:
  push:
    branches:
      - auto-builder/one-repo-consolidation-20260725
    paths:
      - .github/workflows/validate-replacement-lane.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BASE_URL: https://autobuilder-v2-gmryd809q-strategic-minds-advisory.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-builder/one-repo-consolidation-20260725
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - id: install
        name: Install locked dependencies
        continue-on-error: true
        run: npm ci
      - id: audit
        name: Dependency audit
        continue-on-error: true
        run: npm audit --audit-level=high
      - id: security
        name: Secret and environment coverage gate
        continue-on-error: true
        run: npm run validate:security
      - id: lint
        name: Biome lint
        continue-on-error: true
        run: npm run lint
      - id: unit
        name: Unit tests
        continue-on-error: true
        run: npm run test:unit
      - id: typescript
        name: TypeScript
        continue-on-error: true
        run: npx tsc --noEmit
      - id: migration
        name: Migration and rollback contract
        continue-on-error: true
        shell: bash
        run: |
          FORWARD='supabase/migrations/20260726023000_xab_v3_queue_and_approval_hardening.sql'
          ROLLBACK='supabase/rollback/20260726023000_xab_v3_queue_and_approval_hardening.down.sql'
          test -f "$FORWARD"
          test -f "$ROLLBACK"
          grep -qi 'for update skip locked' "$FORWARD"
          grep -q 'xab_v3_claim_workflow_job' "$FORWARD"
          grep -q 'xab_v3_approve_option' "$FORWARD"
          grep -q 'drop function if exists public.xab_v3_claim_workflow_job' "$ROLLBACK"
          grep -q 'to service_role' "$FORWARD"
          if grep -Eqi 'create table .*uasf_|create table .*factory_jobs_v|create table .*autonomous_builds' "$FORWARD"; then
            echo 'Parallel data-plane table detected.'
            exit 1
          fi
      - id: scorecard
        name: Enterprise scorecard
        continue-on-error: true
        run: npm run scorecard
      - id: build
        name: Production build
        continue-on-error: true
        run: npm run build
      - id: chromium
        name: Install Chromium
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - id: playwright
        name: Playwright replacement preview
        continue-on-error: true
        run: npx playwright test --project=chromium

      - name: Write validation receipt
        if: always()
        shell: bash
        env:
          INSTALL: ${{ steps.install.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          SECURITY: ${{ steps.security.outcome }}
          LINT: ${{ steps.lint.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          TYPESCRIPT: ${{ steps.typescript.outcome }}
          MIGRATION: ${{ steps.migration.outcome }}
          SCORECARD: ${{ steps.scorecard.outcome }}
          BUILD: ${{ steps.build.outcome }}
          CHROMIUM: ${{ steps.chromium.outcome }}
          PLAYWRIGHT: ${{ steps.playwright.outcome }}
        run: |
          mkdir -p docs/receipts/validation
          cat > docs/receipts/validation/PR39_REPLACEMENT_VALIDATION.md <<EOF
          # PR #39 Replacement Validation Receipt

          - Validated source commit: \`${GITHUB_SHA}\`
          - Preview URL: \`${PLAYWRIGHT_BASE_URL}\`
          - Validation date: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`
          - Production mutation: \`false\`
          - Locked dependency install: \`${INSTALL}\`
          - Dependency audit: \`${AUDIT}\`
          - Secret and environment coverage: \`${SECURITY}\`
          - Biome lint: \`${LINT}\`
          - Unit tests: \`${UNIT}\`
          - TypeScript: \`${TYPESCRIPT}\`
          - Queue migration and rollback contract: \`${MIGRATION}\`
          - Enterprise scorecard execution: \`${SCORECARD}\`
          - Next.js production build: \`${BUILD}\`
          - Chromium installation: \`${CHROMIUM}\`
          - Chromium desktop/tablet/mobile/PWA suite: \`${PLAYWRIGHT}\`
          - Production locked: \`true\`
          EOF

      - name: Commit durable receipt
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/receipts/validation/PR39_REPLACEMENT_VALIDATION.md
          git commit -m 'docs(validation): record PR39 replacement validation outcomes'
          git pull --rebase origin auto-builder/one-repo-consolidation-20260725
          git push origin HEAD:auto-builder/one-repo-consolidation-20260725

      - name: Enforce validation outcome
        if: always()
        shell: bash
        env:
          INSTALL: ${{ steps.install.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          SECURITY: ${{ steps.security.outcome }}
          LINT: ${{ steps.lint.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          TYPESCRIPT: ${{ steps.typescript.outcome }}
          MIGRATION: ${{ steps.migration.outcome }}
          SCORECARD: ${{ steps.scorecard.outcome }}
          BUILD: ${{ steps.build.outcome }}
          CHROMIUM: ${{ steps.chromium.outcome }}
          PLAYWRIGHT: ${{ steps.playwright.outcome }}
        run: |
          outcomes="$INSTALL $AUDIT $SECURITY $LINT $UNIT $TYPESCRIPT $MIGRATION $SCORECARD $BUILD $CHROMIUM $PLAYWRIGHT"
          if echo "$outcomes" | grep -qv '^success success success success success success success success success success success$'; then
            echo "Validation failed: $outcomes"
            exit 1
          fi

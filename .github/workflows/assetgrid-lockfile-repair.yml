name: AssetGrid Lockfile Repair Helper

on:
  push:
    branches:
      - auto-builder/assetgrid-overnight-autonomy
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate lockfile from package policy
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify repaired dependency audit
        run: npm audit --audit-level=high

      - name: Commit lockfile only when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No package-lock change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): refresh lockfile for nanoid security patch"
          git push origin "HEAD:${GITHUB_REF_NAME}"

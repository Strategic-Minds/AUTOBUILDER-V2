name: One-time run Base44 production handshake

on:
  push:
    branches:
      - auto-builder/run-base44-handshake-20260725

permissions:
  contents: write

jobs:
  handshake:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_aFdds8lsbHMwe2ip4aQdbQ3d
      VERCEL_PROJECT_ID: prj_YSIPjYnM4KtbsiQsVVLHQ5A3AVWe
      BRIDGE_URL: https://autobuilder-v2-strategic-minds-advisory.vercel.app/api/cron/base44-bridge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-builder/run-base44-handshake-20260725
          fetch-depth: 0

      - name: Pull production environment securely
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN secret is missing"; exit 1; }
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@latest env pull .env.production.local --environment=production --yes --token="$VERCEL_TOKEN" >/dev/null
          set -a
          . ./.env.production.local
          set +a
          test -n "${CRON_SECRET:-}" || { echo "CRON_SECRET is absent from production environment"; exit 1; }
          echo "::add-mask::$CRON_SECRET"
          printf '%s' "$CRON_SECRET" > /tmp/cron_secret
          rm -f .env.production.local

      - name: Execute authenticated production handshake
        run: |
          set -euo pipefail
          CRON_SECRET="$(cat /tmp/cron_secret)"
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-vercel-cron-schedule: */5 * * * *" \
            -H "x-service-id: github-one-time-handshake" \
            -H "x-correlation-id: base44-github-production-handshake-20260725-01" \
            -H "x-idempotency-key: base44-github-production-handshake-20260725-01" \
            "$BRIDGE_URL")"
          rm -f /tmp/cron_secret
          printf '%s\n' "$RESPONSE" > /tmp/handshake-response.json
          jq -e '.ok == true and .state == "BASE44_GITHUB_ROUNDTRIP_COMPLETED"' /tmp/handshake-response.json >/dev/null

      - name: Preserve receipt and remove one-time workflow
        run: |
          set -euo pipefail
          mkdir -p receipts
          {
            echo '# Base44 Production Handshake Receipt'
            echo
            echo '- Route: `/api/cron/base44-bridge`'
            echo '- Authentication: production `CRON_SECRET`, value not exposed'
            echo '- Queue job: `base44-github-production-handshake-20260725-01`'
            echo '- Result:'
            echo '```json'
            jq '.' /tmp/handshake-response.json
            echo '```'
          } > receipts/BASE44_PRODUCTION_HANDSHAKE_20260725.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-run-base44-handshake.yml
          git add receipts/BASE44_PRODUCTION_HANDSHAKE_20260725.md
          git commit -m "ops(receipt): record Base44 production handshake"
          git push origin HEAD:auto-builder/run-base44-handshake-20260725

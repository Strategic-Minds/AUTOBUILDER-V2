name: Refresh dependency lockfile

on:
  push:
    branches:
      - auto-builder/forensic-consolidation-20260725
    paths:
      - package.json
      - .github/workflows/refresh-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out consolidation branch
        uses: actions/checkout@v4
        with:
          ref: auto-builder/forensic-consolidation-20260725
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit refreshed lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): synchronize dependency lockfile"
          git push origin HEAD:auto-builder/forensic-consolidation-20260725

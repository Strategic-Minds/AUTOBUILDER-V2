name: Patch deterministic packs

on:
  push:
    branches:
      - auto-builder/forensic-consolidation-20260725
    paths:
      - .github/workflows/patch-deterministic-packs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-builder/forensic-consolidation-20260725
          fetch-depth: 0

      - name: Replace unavailable swarm pack generation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/factory/xab-v3-store.ts')
          text = path.read_text()
          import_line = "import { buildBrandOptions, buildWebsiteOptions } from './pack-generator'\n"
          if import_line not in text:
              text = text.replace("import { monitorNativeBuild, startNativeBuild } from './native-build-adapter'\n", "import { monitorNativeBuild, startNativeBuild } from './native-build-adapter'\n" + import_line, 1)

          brand = """async function generateBrandOptions(project: ProjectRow) {
            const options = buildBrandOptions(project).map((option) => ({
              project_id: project.id,
              ...option,
              config: { ...option.config, generation_mode: 'deterministic_complete_pack_v1' },
            }))
            await db('xab_v3_logo_options?on_conflict=project_id,option_number', 'POST', options, 'resolution=merge-duplicates,return=representation')
            await ensureApproval(project.id, 'logo')
            await patchProject(project.id, { status: 'waiting_for_approval' })
            await receipt(project.id, 'brand_options_generated', true, {
              options: 3,
              generation_mode: 'deterministic_complete_pack_v1',
              required_fields: ['marks', 'palette', 'typography', 'imagery', 'messaging', 'voice', 'slogans', 'desktop_usage', 'mobile_usage'],
            })
            return { options: 3, generation_mode: 'deterministic_complete_pack_v1' }
          }

          async function generateWebsiteOptions(project: ProjectRow) {
            const logo = await selectedOption(project.id, 'logo')
            const options = buildWebsiteOptions(project, logo).map((option) => ({
              project_id: project.id,
              ...option,
              config: { ...option.config, generation_mode: 'deterministic_complete_pack_v1' },
            }))
            await db('xab_v3_website_options?on_conflict=project_id,option_number', 'POST', options, 'resolution=merge-duplicates,return=representation')
            await ensureApproval(project.id, 'website')
            await patchProject(project.id, { status: 'waiting_for_approval' })
            await receipt(project.id, 'website_options_generated', true, {
              options: 3,
              generation_mode: 'deterministic_complete_pack_v1',
              required_fields: ['desktop', 'tablet', 'mobile_pwa', 'pages', 'sections', 'navigation', 'funnel', 'forms', 'integrations', 'states', 'accessibility'],
            })
            return { options: 3, generation_mode: 'deterministic_complete_pack_v1' }
          }

          function textValue("""
          text, count = re.subn(
              r"async function generateBrandOptions\([\s\S]*?\nfunction textValue\(",
              brand,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'pack generation replacement count was {count}')

          path.write_text(text)
          PY

      - name: Commit deterministic pack patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/factory/xab-v3-store.ts
          git commit -m "feat(factory): generate complete packs without unavailable swarm tools"
          git push origin HEAD:auto-builder/forensic-consolidation-20260725

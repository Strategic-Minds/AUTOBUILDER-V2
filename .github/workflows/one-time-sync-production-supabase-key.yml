name: One-time sync production Supabase key

on:
  push:
    branches:
      - auto-builder/sync-production-supabase-key-20260725

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: azajysheebfhyzoyplpf
      VERCEL_ORG_ID: team_aFdds8lsbHMwe2ip4aQdbQ3d
      VERCEL_PROJECT_ID: prj_YSIPjYnM4KtbsiQsVVLHQ5A3AVWe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-builder/sync-production-supabase-key-20260725
          fetch-depth: 0

      - name: Resolve secure credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FALLBACK_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN secret is missing"; exit 1; }

          SERVICE_KEY=""
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            SERVICE_KEY="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys" \
              | jq -r '.[] | select(.name == "service_role" and (.api_key // "") != "") | .api_key' \
              | head -n 1)"
          fi

          if [ -z "$SERVICE_KEY" ] && [ -n "$FALLBACK_SERVICE_ROLE_KEY" ]; then
            SERVICE_KEY="$FALLBACK_SERVICE_ROLE_KEY"
          fi

          test -n "$SERVICE_KEY" || { echo "No current Supabase service-role credential is available in GitHub secrets"; exit 1; }
          echo "::add-mask::$SERVICE_KEY"
          printf '%s' "$SERVICE_KEY" > /tmp/supabase_service_role_key

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Replace production variable without exposing value
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest env rm SUPABASE_SERVICE_ROLE_KEY production --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
          cat /tmp/supabase_service_role_key | npx --yes vercel@latest env add SUPABASE_SERVICE_ROLE_KEY production --token="$VERCEL_TOKEN" >/dev/null
          rm -f /tmp/supabase_service_role_key

      - name: Redeploy current main source to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest --prod --yes --token="$VERCEL_TOKEN"

      - name: Remove one-time workflow and preserve receipt
        if: success()
        run: |
          set -euo pipefail
          mkdir -p receipts
          cat > receipts/BASE44_PRODUCTION_SUPABASE_KEY_SYNC_20260725.md <<'EOF'
          # Base44 Production Supabase Key Sync Receipt

          - Supabase project: `azajysheebfhyzoyplpf`
          - Vercel project: `prj_YSIPjYnM4KtbsiQsVVLHQ5A3AVWe`
          - Variable replaced: `SUPABASE_SERVICE_ROLE_KEY`
          - Secret value exposed: no
          - Production redeployment requested: yes
          - Purpose: restore the durable Base44 bridge queue and receipt worker
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-sync-production-supabase-key.yml
          git add receipts/BASE44_PRODUCTION_SUPABASE_KEY_SYNC_20260725.md
          git commit -m "ops(receipt): record production Supabase key synchronization"
          git push origin HEAD:auto-builder/sync-production-supabase-key-20260725

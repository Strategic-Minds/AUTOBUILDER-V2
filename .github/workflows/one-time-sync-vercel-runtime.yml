name: One-Time Sync Native Vercel Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-sync-vercel-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_aFdds8lsbHMwe2ip4aQdbQ3d
      VERCEL_PROJECT_ID: prj_YSIPjYnM4KtbsiQsVVLHQ5A3AVWe
    steps:
      - name: Require encrypted GitHub secret
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'BLOCKED: GitHub secret VERCEL_TOKEN is not configured'; exit 1; }

      - name: Upsert encrypted production environment names
        shell: bash
        run: |
          node <<'NODE'
          const token = process.env.VERCEL_TOKEN
          const teamId = process.env.VERCEL_TEAM_ID
          const projectId = process.env.VERCEL_PROJECT_ID
          const base = 'https://api.vercel.com'
          const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }

          async function request(path, options = {}) {
            const response = await fetch(`${base}${path}`, { ...options, headers: { ...headers, ...(options.headers || {}) } })
            const text = await response.text()
            let data = null
            try { data = text ? JSON.parse(text) : null } catch { data = text }
            if (!response.ok) throw new Error(`${options.method || 'GET'} ${path} failed ${response.status}: ${String(text).slice(0, 300)}`)
            return data
          }

          async function upsert(key, value) {
            const listing = await request(`/v9/projects/${projectId}/env?teamId=${encodeURIComponent(teamId)}`)
            const existing = (listing.envs || []).filter((item) => item.key === key && (!item.target || item.target.includes('production')))
            for (const item of existing) {
              await request(`/v9/projects/${projectId}/env/${item.id}?teamId=${encodeURIComponent(teamId)}`, { method: 'DELETE' })
            }
            await request(`/v10/projects/${projectId}/env?teamId=${encodeURIComponent(teamId)}`, {
              method: 'POST',
              body: JSON.stringify({ key, value, type: 'encrypted', target: ['production'] }),
            })
          }

          await upsert('VERCEL_TOKEN', token)
          await upsert('VERCEL_TEAM_ID', teamId)
          console.log('PASS: production environment names synchronized without exposing values')
          NODE

      - name: Verify key presence only
        shell: bash
        run: |
          node <<'NODE'
          const token = process.env.VERCEL_TOKEN
          const teamId = process.env.VERCEL_TEAM_ID
          const projectId = process.env.VERCEL_PROJECT_ID
          const response = await fetch(`https://api.vercel.com/v9/projects/${projectId}/env?teamId=${encodeURIComponent(teamId)}`, { headers: { Authorization: `Bearer ${token}` } })
          if (!response.ok) throw new Error(`Environment verification failed ${response.status}`)
          const data = await response.json()
          const keys = new Set((data.envs || []).filter((item) => !item.target || item.target.includes('production')).map((item) => item.key))
          for (const key of ['VERCEL_TOKEN', 'VERCEL_TEAM_ID']) {
            if (!keys.has(key)) throw new Error(`Missing production environment name: ${key}`)
          }
          console.log('PASS: required production environment names are present')
          NODE

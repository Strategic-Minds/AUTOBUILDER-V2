name: Refresh Biome dependency lock

on:
  push:
    branches:
      - auto-builder/forensic-consolidation-20260725
    paths:
      - .github/workflows/refresh-biome-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-builder/forensic-consolidation-20260725
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): replace ESLint tree with Biome lock"
          git push origin HEAD:auto-builder/forensic-consolidation-20260725

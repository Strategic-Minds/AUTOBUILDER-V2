name: Playwright E2E Tests

on:
  push:
    branches: [main, autonomy-test]
  pull_request:
    branches: [main]

jobs:
  playwright:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'https://www.autobuilderos.com' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        
      - name: Run Playwright tests
        run: npx playwright test --project=chromium-headless
        
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.sha }}
          path: |
            playwright-report/
            playwright-results.json
            playwright-junit.xml
            screenshots/
          retention-days: 7
          
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ github.sha }}
          path: |
            test-results/
          retention-days: 7


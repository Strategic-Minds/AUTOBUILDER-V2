name: Playwright E2E — Release Candidate

on:
  pull_request:
    branches: [main, autonomy-test]
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Current release-candidate Vercel URL to test'
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Chromium E2E Tests
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve exact current release-candidate URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_PREVIEW_URL: ${{ inputs.preview_url || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          PREVIEW_URL="$MANUAL_PREVIEW_URL"

          if [ -z "$PREVIEW_URL" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo 'ERROR: CURRENT_PR_PREVIEW_URL_REQUIRED'
              exit 1
            fi

            VERCEL_STATE=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // "missing"')
            if [ "$VERCEL_STATE" != 'success' ]; then
              echo "ERROR: VERCEL_HEAD_STATUS_NOT_READY state=$VERCEL_STATE"
              exit 1
            fi

            PREVIEW_URL=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.user.login == "vercel[bot]") | .body' \
              | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' \
              | tail -n 1 || true)
          fi

          if [ -z "$PREVIEW_URL" ]; then
            echo 'ERROR: CURRENT_PR_PREVIEW_URL_REQUIRED'
            exit 1
          fi
          if ! echo "$PREVIEW_URL" | grep -Eq '^https://[^/]+\.vercel\.app/?$'; then
            echo 'ERROR: Target must be an HTTPS Vercel deployment URL.'
            exit 1
          fi

          echo "PLAYWRIGHT_BASE_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "CURRENT_PR_PREVIEW_URL=$PREVIEW_URL"
          echo "VERCEL_HEAD_STATUS=success"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright headless tests
        run: npx playwright test --project=chromium
        env:
          CRON_SECRET: ${{ secrets.PLAYWRIGHT_TEST_SECRET }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: playwright-html-${{ github.sha }}
          path: playwright-report/
          retention-days: 14

      - name: Upload JSON results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: playwright-json-${{ github.sha }}
          path: playwright-results.json
          retention-days: 14

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: playwright-junit-${{ github.sha }}
          path: playwright-junit.xml
          retention-days: 14

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: playwright-screenshots-${{ github.sha }}
          path: screenshots/
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: playwright-traces-${{ github.sha }}
          path: test-results/
          retention-days: 7

      - name: Publish test summary
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: playwright-all-${{ github.sha }}
          path: |
            playwright-report/
            playwright-results.json
            playwright-junit.xml
          retention-days: 14

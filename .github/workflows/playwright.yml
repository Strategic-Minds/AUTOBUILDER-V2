name: Playwright E2E — Release Candidate

on:
  pull_request:
    branches: [main, autonomy-test]
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Current release-candidate Vercel URL to test'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Chromium E2E Tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.preview_url || '' }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Require current release-candidate URL
        shell: bash
        run: |
          if [ -z "$PLAYWRIGHT_BASE_URL" ]; then
            echo 'ERROR: CURRENT_PR_PREVIEW_URL_REQUIRED'
            echo 'A pull-request run must not reuse a hard-coded or stale deployment.'
            echo 'Dispatch this workflow on the PR branch with its current Vercel Preview URL.'
            exit 1
          fi
          if ! echo "$PLAYWRIGHT_BASE_URL" | grep -Eq '^https://[^/]+\.vercel\.app/?$'; then
            echo 'ERROR: Target must be an HTTPS Vercel deployment URL.'
            exit 1
          fi
          echo "Target: $PLAYWRIGHT_BASE_URL"

      - name: Run Playwright headless tests
        run: npx playwright test --project=chromium
        env:
          CRON_SECRET: ${{ secrets.PLAYWRIGHT_TEST_SECRET }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: playwright-html-${{ github.sha }}
          path: playwright-report/
          retention-days: 14

      - name: Upload JSON results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: playwright-json-${{ github.sha }}
          path: playwright-results.json
          retention-days: 14

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: playwright-junit-${{ github.sha }}
          path: playwright-junit.xml
          retention-days: 14

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: playwright-screenshots-${{ github.sha }}
          path: screenshots/
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: playwright-traces-${{ github.sha }}
          path: test-results/
          retention-days: 7

      - name: Publish test summary
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: playwright-all-${{ github.sha }}
          path: |
            playwright-report/
            playwright-results.json
            playwright-junit.xml
          retention-days: 14

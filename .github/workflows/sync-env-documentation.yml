name: Sync environment documentation

on:
  push:
    branches:
      - auto-builder/forensic-consolidation-20260725
    paths:
      - .github/workflows/sync-env-documentation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-builder/forensic-consolidation-20260725
          fetch-depth: 0
      - name: Append undocumented environment names
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const root = process.cwd()
          const skip = new Set(['node_modules', '.git', '.next', 'test-results', 'playwright-report'])
          const exts = new Set(['.ts', '.tsx', '.js', '.jsx'])
          const referenced = new Set()

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (skip.has(entry.name)) continue
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) {
                walk(full)
                continue
              }
              if (!exts.has(path.extname(entry.name))) continue
              const content = fs.readFileSync(full, 'utf8')
              for (const match of content.matchAll(/process\.env\.([A-Z0-9_]+)/g)) referenced.add(match[1])
            }
          }

          walk(root)
          const target = path.join(root, '.env.example.md')
          let content = fs.readFileSync(target, 'utf8')
          const documented = new Set([...content.matchAll(/^([A-Z0-9_]+)=/gm)].map((match) => match[1]))
          const missing = [...referenced].filter((name) => !documented.has(name)).sort()
          if (!missing.length) {
            console.log('All environment names are already documented')
            process.exit(0)
          }
          content += `\n## Auto-discovered source references\n\nThese names are referenced by source code. Values remain intentionally blank.\n\n\`\`\`bash\n${missing.map((name) => `${name}=`).join('\n')}\n\`\`\`\n`
          fs.writeFileSync(target, content)
          console.log(`Documented ${missing.length} missing environment names: ${missing.join(', ')}`)
          NODE
      - name: Commit synchronized documentation
        shell: bash
        run: |
          if git diff --quiet -- .env.example.md; then
            echo 'No documentation change required'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example.md
          git commit -m "docs(env): synchronize source-referenced variable names"
          git pull --rebase origin auto-builder/forensic-consolidation-20260725
          git push origin HEAD:auto-builder/forensic-consolidation-20260725

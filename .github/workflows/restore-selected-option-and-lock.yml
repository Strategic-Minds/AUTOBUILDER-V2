name: Restore selected option and lockfile

on:
  push:
    branches:
      - auto-builder/forensic-consolidation-20260725
    paths:
      - .github/workflows/restore-selected-option-and-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-builder/forensic-consolidation-20260725
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore selected option helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/factory/xab-v3-store.ts')
          text = path.read_text()
          anchor = """async function ensureApproval(projectId: string, kind: 'logo' | 'website') {
            const existing = await pendingApproval(projectId, kind)
            if (existing) return existing
            const rows = await db<Array<{ id: string; state: string }>>('xab_v3_approval_requests', 'POST', {
              project_id: projectId,
              kind,
              state: 'pending',
            })
            return rows[0]
          }
          """
          helper = """
          async function selectedOption(projectId: string, kind: 'logo' | 'website') {
            const table = kind === 'logo' ? 'xab_v3_logo_options' : 'xab_v3_website_options'
            const approvals = await db<Array<{ selected_option: number }>>(
              `xab_v3_approval_requests?project_id=eq.${enc(projectId)}&kind=eq.${kind}&state=eq.approved&order=created_at.desc&limit=1`,
            )
            const selected = approvals[0]?.selected_option
            if (!selected) throw new Error(`No approved ${kind} option exists`)
            const rows = await db<JsonRecord[]>(
              `${table}?project_id=eq.${enc(projectId)}&option_number=eq.${selected}&limit=1`,
            )
            if (!rows[0]) throw new Error(`Approved ${kind} option is missing`)
            return rows[0]
          }
          """
          if helper.strip() in text:
              raise SystemExit('selectedOption already restored')
          if anchor not in text:
              raise SystemExit('ensureApproval anchor not found')
          path.write_text(text.replace(anchor, anchor + helper, 1))
          PY

      - name: Regenerate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json lib/factory/xab-v3-store.ts
          git commit -m "fix(factory): restore approved option lookup and compatible lint lock"
          git push origin HEAD:auto-builder/forensic-consolidation-20260725

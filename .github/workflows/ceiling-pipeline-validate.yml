name: Ceiling Pipeline Validation
on:
  push:
    branches: [build/workbook-autonomous-pipeline-ceiling-v1]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --testPathPattern=pipeline
      - run: npm run build
name: Remove obsolete swarm helpers

on:
  push:
    branches:
      - auto-builder/forensic-consolidation-20260725
    paths:
      - .github/workflows/remove-obsolete-swarm-helpers.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-builder/forensic-consolidation-20260725
          fetch-depth: 0
      - name: Remove dead swarm and fallback helpers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/factory/xab-v3-store.ts')
          text = path.read_text()
          text, count = re.subn(
              r"function fallbackBrandOptions\([\s\S]*?\nfunction textValue\(",
              "function textValue(",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'obsolete helper removal count was {count}')
          path.write_text(text)
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/factory/xab-v3-store.ts
          git commit -m "refactor(factory): remove obsolete swarm helpers"
          git push origin HEAD:auto-builder/forensic-consolidation-20260725

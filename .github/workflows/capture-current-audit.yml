name: Capture current audit

on:
  push:
    branches:
      - auto-builder/forensic-consolidation-20260725
    paths:
      - .github/workflows/capture-current-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-builder/forensic-consolidation-20260725
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Write sanitized current audit from Biome lockfile
        shell: bash
        run: |
          mkdir -p docs/receipts/validation
          npm audit --json > /tmp/current-audit.json || true
          node <<'NODE'
          const fs = require('fs')
          const input = JSON.parse(fs.readFileSync('/tmp/current-audit.json', 'utf8'))
          const vulnerabilities = Object.entries(input.vulnerabilities || {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            direct: item.isDirect,
            via: (item.via || []).map((value) => typeof value === 'string' ? value : {
              source: value.source,
              name: value.name,
              dependency: value.dependency,
              title: value.title,
              url: value.url,
              severity: value.severity,
              range: value.range,
            }),
            effects: item.effects || [],
            range: item.range,
            nodes: item.nodes || [],
            fixAvailable: item.fixAvailable,
          }))
          fs.writeFileSync('docs/receipts/validation/NPM_AUDIT_CURRENT.json', JSON.stringify({
            generated_at: new Date().toISOString(),
            lockfile_sha256: require('crypto').createHash('sha256').update(fs.readFileSync('package-lock.json')).digest('hex'),
            metadata: input.metadata || {},
            vulnerabilities,
          }, null, 2) + '\n')
          NODE
      - name: Commit current audit receipt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/receipts/validation/NPM_AUDIT_CURRENT.json
          git commit -m "docs(validation): refresh audit after Biome migration"
          git push origin HEAD:auto-builder/forensic-consolidation-20260725

{
  "name": "AUTO_BUILDER Master Validate",
  "on": {
    "pull_request": { "branches": ["main", "develop"] },
    "push": { "branches": ["main"] },
    "workflow_dispatch": {}
  },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-latest",
      "steps": [
        { "uses": "actions/checkout@v4" },
        {
          "uses": "actions/setup-node@v4",
          "with": { "node-version": "22", "cache": "npm" }
        },
        { "name": "Debug info", "run": "node --version && npm --version" },
        { "name": "Install dependencies", "run": "npm ci --verbose" },
        { "name": "TypeScript check", "run": "npx tsc --noEmit --listFiles 2>&1 | head -100" },
        { "name": "List tsconfig", "run": "cat tsconfig.json" },
        { "name": "Build", "run": "npm run build --if-present" }
      ]
    }
  }
}
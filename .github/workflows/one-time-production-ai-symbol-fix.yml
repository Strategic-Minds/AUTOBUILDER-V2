name: One-time production AI symbol fix

on:
  push:
    branches:
      - auto-builder/production-ai-symbol-fix-20260725

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-builder/production-ai-symbol-fix-20260725
          fetch-depth: 0
      - name: Patch current AI SDK symbols
        run: |
          python - <<'PY'
          from pathlib import Path

          agent = Path('components/agent/agent-chat.tsx')
          text = agent.read_text()
          old = 'import { useChat, DefaultChatTransport, lastAssistantMessageIsCompleteWithToolCalls } from "@ai-sdk/react";'
          new = 'import { useChat } from "@ai-sdk/react";\nimport { DefaultChatTransport, lastAssistantMessageIsCompleteWithToolCalls } from "ai";'
          if old not in text:
              raise SystemExit('Expected agent-chat import was not found')
          agent.write_text(text.replace(old, new, 1))

          route = Path('app/api/chat/route.ts')
          text = route.read_text()
          text = text.replace('convertToCoreMessages', 'convertToModelMessages')
          text = text.replace('toDataStreamResponse()', 'toUIMessageStreamResponse()')
          route.write_text(text)
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-production-ai-symbol-fix.yml
          git add app/api/chat/route.ts components/agent/agent-chat.tsx
          git commit -m "fix(ai): align remaining production SDK symbols"
          git push origin HEAD:auto-builder/production-ai-symbol-fix-20260725
